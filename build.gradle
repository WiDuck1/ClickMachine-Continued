plugins {
    id 'net.fabricmc.fabric-loom' version "${loomVersion}"
    id 'maven-publish'
}

base.archivesName = "${fileName}-Fabric-${mcVersion}"
group = modGroup
java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
java.withSourcesJar()

def devRunDirectory = "run-fabric-${mcVersion}"
['client', 'server', 'gametest', 'client-smoke', 'data'].each { mkdir("${devRunDirectory}/${it}") }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation "teamreborn:energy:${energyVersion}"
    include "teamreborn:energy:${energyVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        client {
            displayName = 'Click Machine - Fabric 26.2 Playtest'
            runDirectory = file("${devRunDirectory}/client")
            preferGradleTask = true
        }
        server {
            runDirectory = file("${devRunDirectory}/server")
            preferGradleTask = true
            programArguments.add('--nogui')
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'clickmachine_tests'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
    configureDataGeneration {
        client = true
        outputDirectory = file('src/generated/resources')
    }
}

loom.runs.named('gameTest') {
    runDirectory = file("${devRunDirectory}/gametest")
}

loom.runs.named('datagen') {
    runDirectory = file("${devRunDirectory}/data")
    systemProperties.put('fabric-api.datagen.modid', modid)
}

loom.runs.named('clientGameTest') {
    systemProperties.put('clickmachine.clientSmoke', 'true')
}

tasks.named('runClientGameTest') {
    doFirst {
        def config = file('build/run/clientGameTest/config/clickmachine.cfg')
        config.parentFile.mkdirs()
        def usesRF = providers.gradleProperty('smokeUsesRF').getOrElse('true')
        config.text = file('src/main/resources/clickmachine-default.cfg').text.replace('B:"Uses RF"=false', 'B:"Uses RF"=' + usesRF)
    }
}

tasks.register('runClientSmoke') { dependsOn 'runClientGameTest' }
tasks.register('runGameTestServer') { dependsOn 'runGameTest' }
tasks.register('runData') { dependsOn 'runDatagen' }

sourceSets.main.resources {
    exclude '**/.cache/**'
}

processResources {
    inputs.properties(version: version, mcVersion: mcVersion, loaderVersion: loaderVersion, fabricApiVersion: fabricApiVersion, author: author, desc: desc)
    filesMatching('fabric.mod.json') {
        expand(version: version, mcVersion: mcVersion, loaderVersion: loaderVersion, fabricApiVersion: fabricApiVersion, author: author, desc: desc)
    }
}

test { useJUnitPlatform() }
jar { from('LICENSE') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${fileName}-Fabric"
            version = "${mcVersion}-${project.version}"
            from components.java
        }
    }
}
